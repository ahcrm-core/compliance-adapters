name: ORE Native Real 001 First Red

on:
  push:
    branches:
      - ore-v0.2-native-real-001
  workflow_dispatch:

jobs:
  first-red:
    name: Existing syncFailedReasons test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Run unchanged target test
        run: npm test --workspace=sanctions-oracle -- --runInBand test/syncFailedReasons.test.ts
